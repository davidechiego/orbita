<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Orbita — Follow arXiv</title>
<meta name="description" content="Follow authors and topics on arXiv in a social-style feed." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#12121c" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #12121c;
    --bg-elevated: #191927;
    --bg-card: #1c1c2c;
    --paper: #f4efe4;
    --ink: #e9e7f2;
    --ink-dim: #9a97b3;
    --ink-faint: #63607c;
    --border: #2a2a40;
    --gold: #c9a655;
    --gold-dim: #8a7440;
    --violet: #8b7ff0;
    --violet-dim: #5c539e;
    --danger: #d97757;
    --radius-s: 6px;
    --radius-m: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: var(--safe-top); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    min-height: 100%;
  }
  .serif { font-family: 'Source Serif 4', Georgia, serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  header.top {
    position: sticky;
    top: var(--safe-top);
    z-index: 10;
    background: rgba(18,18,28,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
  }
  header.top h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header.top h1 .dot { color: var(--gold); }
  header.top p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--ink-dim);
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 16px 96px;
  }

  .view { display: none; animation: fadein .25s ease; }
  .view.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- Feed ---- */
  .empty {
    border: 1px dashed var(--border);
    border-radius: var(--radius-m);
    padding: 36px 24px;
    text-align: center;
    color: var(--ink-dim);
    margin-top: 12px;
  }
  .empty .serif { font-size: 18px; color: var(--ink); display: block; margin-bottom: 8px; }
  .empty button { margin-top: 16px; }

  .feed-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 10px;
  }
  .feed-toolbar .count { font-size: 13px; color: var(--ink-dim); }
  .iconbtn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--ink-dim);
    border-radius: var(--radius-s);
    padding: 7px 12px;
    font-size: 13px;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .iconbtn:active { transform: scale(0.97); }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: var(--radius-s);
    padding: 16px 16px 14px;
    margin-bottom: 12px;
  }
  .card.by-author { border-left-color: var(--gold); }
  .card.by-topic { border-left-color: var(--violet); }
  .card.unread .title::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    margin-right: 8px;
    vertical-align: middle;
  }
  .card .source-tag {
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .card .source-tag.author { color: var(--gold-dim); }
  .card .source-tag.topic { color: var(--violet-dim); }
  .card .title {
    font-size: 16.5px;
    line-height: 1.35;
    font-weight: 600;
    margin: 0 0 6px;
  }
  .card .authors {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .card .abstract {
    font-size: 13.5px;
    color: var(--ink-dim);
    line-height: 1.55;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .card .tag {
    font-size: 10.5px;
    color: var(--ink-faint);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .card .links { display: flex; gap: 14px; align-items: center; }
  .card .links a { color: var(--ink-dim); font-size: 12.5px; text-decoration: none; border-bottom: 1px solid var(--ink-faint); }
  .card .links a:hover { color: var(--gold); border-color: var(--gold); }
  .card .date-id { font-size: 11px; color: var(--ink-faint); }

  /* ---- Discover ---- */
  .section-label {
    font-size: 13px;
    color: var(--ink-dim);
    margin: 22px 0 10px;
  }
  .section-label:first-child { margin-top: 4px; }
  .searchbox {
    display: flex;
    gap: 8px;
  }
  .searchbox input {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: var(--radius-s);
    padding: 11px 13px;
    font-size: 14.5px;
    font-family: inherit;
  }
  .searchbox input:focus { outline: none; border-color: var(--violet-dim); }
  .searchbox button {
    background: var(--gold);
    color: #201a0c;
    border: none;
    border-radius: var(--radius-s);
    padding: 0 16px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .searchbox button:disabled { opacity: 0.5; }

  .author-hit {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .author-hit .name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .author-hit .sample { font-size: 12.5px; color: var(--ink-dim); margin-bottom: 10px; line-height: 1.4; }

  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--ink-dim);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .chip.on { border-color: var(--violet); color: var(--ink); background: rgba(139,127,240,0.12); }
  .chip .catcode { color: var(--ink-faint); font-size: 11px; margin-left: 5px; }

  .btn {
    background: var(--gold);
    color: #201a0c;
    border: none;
    border-radius: var(--radius-s);
    padding: 9px 16px;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-dim);
  }
  .btn.small { padding: 6px 12px; font-size: 12.5px; }
  .btn:disabled { opacity: 0.5; }

  /* ---- Following ---- */
  .follow-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .follow-row .label { font-size: 14.5px; }
  .follow-row .kind { display: block; font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }
  .follow-row button {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 12.5px;
    cursor: pointer;
    text-decoration: underline;
  }

  /* ---- Bottom nav ---- */
  nav.bottom {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding-bottom: var(--safe-bottom);
    background: rgba(18,18,28,0.94);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 20;
  }
  nav.bottom button {
    flex: 1;
    background: none;
    border: none;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: 11.5px;
    padding: 11px 0 9px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    position: relative;
  }
  nav.bottom button.active { color: var(--gold); }
  nav.bottom button svg { width: 21px; height: 21px; }
  nav.bottom .badge {
    position: absolute;
    top: 4px;
    right: calc(50% - 16px);
    background: var(--danger);
    color: #fff;
    font-size: 9.5px;
    font-weight: 700;
    min-width: 14px;
    height: 14px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
  }

  .toast {
    position: fixed;
    bottom: calc(70px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 30;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--ink-faint);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::selection { background: var(--violet-dim); }
  a { color: inherit; }
</style>
</head>
<body>

<header class="top">
  <h1 class="serif">Orbita<span class="dot">.</span></h1>
  <p id="headerSub">arXiv, followed your way</p>
</header>

<main>

  <!-- FEED -->
  <section class="view active" id="view-feed">
    <div class="feed-toolbar">
      <span class="count" id="feedCount"></span>
      <button class="iconbtn" id="refreshBtn">
        <span id="refreshIcon">↻</span> Refresh
      </button>
    </div>
    <div id="feedList"></div>
  </section>

  <!-- DISCOVER -->
  <section class="view" id="view-discover">
    <div class="section-label">Find an author</div>
    <div class="searchbox">
      <input type="text" id="authorInput" placeholder="e.g. Juan Maldacena" autocomplete="off" />
      <button id="authorSearchBtn">Search</button>
    </div>
    <div id="authorResults" style="margin-top:14px;"></div>

    <div class="section-label">Topics — categories</div>
    <div class="chip-grid" id="categoryChips"></div>

    <div class="section-label">Topics — keywords</div>
    <div class="chip-grid" id="keywordChips"></div>
    <div class="searchbox" style="margin-top:10px;">
      <input type="text" id="customTopicInput" placeholder="Custom keyword, e.g. domain walls" autocomplete="off" />
      <button id="customTopicBtn">Add</button>
    </div>
  </section>

  <!-- FOLLOWING -->
  <section class="view" id="view-following">
    <div class="section-label">Authors</div>
    <div id="followedAuthorsList"></div>
    <div class="section-label">Topics</div>
    <div id="followedTopicsList"></div>

    <div class="section-label">Notifications</div>
    <div class="follow-row" style="align-items:flex-start;">
      <div>
        <span class="label" id="notifLabel">Get notified about new papers</span>
        <span class="kind">Checked each time you open the app — nothing runs in the background.</span>
      </div>
      <button class="btn small" id="notifBtn">Enable</button>
    </div>
  </section>

</main>

<nav class="bottom">
  <button class="tab active" data-view="feed">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/></svg>
    Feed
    <span class="badge" id="feedBadge" style="display:none;"></span>
  </button>
  <button class="tab" data-view="discover">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    Discover
  </button>
  <button class="tab" data-view="following">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9Z"/></svg>
    Following
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  // ---------- storage ----------
  const LS = {
    authors: "orbita_authors",      // [{id,name}]
    topics: "orbita_topics",        // [{id,kind:'category'|'keyword', label, query}]
    seen: "orbita_seen",            // { [entryId]: true }
    cache: "orbita_cache",          // last built feed, for instant paint
  };
  const load = (k, fallback) => {
    try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fallback : v; }
    catch { return fallback; }
  };
  const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  let authors = load(LS.authors, []);
  let topics = load(LS.topics, []);
  let seen = load(LS.seen, {});
  let currentFeed = load(LS.cache, []);

  const CATEGORY_PRESETS = [
    { code: "hep-th", label: "Theoretical HEP" },
    { code: "hep-ph", label: "Phenomenology" },
    { code: "gr-qc", label: "GR & quantum cosmology" },
    { code: "astro-ph.CO", label: "Cosmology" },
    { code: "cond-mat.str-el", label: "Strongly correlated matter" },
    { code: "math-ph", label: "Mathematical physics" },
    { code: "quant-ph", label: "Quantum physics" },
  ];
  const KEYWORD_PRESETS = [
    "QFT", "topological defects", "domain walls", "cosmic strings",
    "sphaleron", "inflation", "AdS/CFT", "lattice gauge theory",
  ];

  // ---------- toast ----------
  const toastEl = document.getElementById("toast");
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  // ---------- arXiv fetching ----------
  const API = "https://export.arxiv.org/api/query";
  const PROXY = (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u);

  async function arxivRaw(url) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error("bad status");
      return await r.text();
    } catch (e) {
      // Likely a CORS or network hiccup on this host — fall back to a public proxy.
      const r2 = await fetch(PROXY(url));
      if (!r2.ok) throw new Error("proxy failed too");
      return await r2.text();
    }
  }

  function buildUrl(searchQuery, maxResults) {
    const params = new URLSearchParams({
      search_query: searchQuery,
      sortBy: "submittedDate",
      sortOrder: "descending",
      max_results: String(maxResults || 15),
    });
    return API + "?" + params.toString();
  }

  function parseFeed(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, "text/xml");
    const entries = Array.from(doc.getElementsByTagName("entry"));
    return entries.map((entry) => {
      const get = (tag) => entry.getElementsByTagName(tag)[0]?.textContent?.trim() || "";
      const id = get("id");
      const shortId = (id.match(/abs\/(.+)$/) || [,id])[1];
      const authorsList = Array.from(entry.getElementsByTagName("author"))
        .map((a) => a.getElementsByTagName("name")[0]?.textContent?.trim())
        .filter(Boolean);
      const categories = Array.from(entry.getElementsByTagName("category"))
        .map((c) => c.getAttribute("term"))
        .filter(Boolean);
      let pdfLink = "";
      Array.from(entry.getElementsByTagName("link")).forEach((l) => {
        if (l.getAttribute("title") === "pdf") pdfLink = l.getAttribute("href");
      });
      return {
        id, shortId,
        title: get("title").replace(/\s+/g, " "),
        summary: get("summary").replace(/\s+/g, " "),
        published: get("published"),
        authors: authorsList,
        categories,
        absLink: id,
        pdfLink: pdfLink || id.replace("/abs/", "/pdf/"),
      };
    });
  }

  async function fetchForSource(source) {
    let q;
    if (source.type === "author") q = `au:"${source.name}"`;
    else if (source.kind === "category") q = `cat:${source.query}`;
    else q = `all:"${source.query}"`;
    const url = buildUrl(q, 12);
    const xml = await arxivRaw(url);
    return parseFeed(xml).map((p) => ({ ...p, _source: source }));
  }

  async function rebuildFeed() {
    const sources = [
      ...authors.map((a) => ({ type: "author", ...a })),
      ...topics.map((t) => ({ type: "topic", ...t })),
    ];
    if (sources.length === 0) { currentFeed = []; save(LS.cache, currentFeed); return currentFeed; }

    const results = await Promise.allSettled(sources.map(fetchForSource));
    const byId = new Map();
    results.forEach((r) => {
      if (r.status !== "fulfilled") return;
      r.value.forEach((paper) => {
        const existing = byId.get(paper.id);
        if (existing) {
          existing._sources.push(paper._source);
        } else {
          byId.set(paper.id, { ...paper, _sources: [paper._source] });
        }
      });
    });
    const merged = Array.from(byId.values()).sort(
      (a, b) => new Date(b.published) - new Date(a.published)
    );
    currentFeed = merged.slice(0, 60);
    save(LS.cache, currentFeed);
    return currentFeed;
  }

  // ---------- rendering ----------
  function sourceLabel(sources) {
    const author = sources.find((s) => s.type === "author");
    const topic = sources.find((s) => s.type === "topic");
    const parts = [];
    if (author) parts.push(`followed author: ${author.name}`);
    if (topic) parts.push(`topic: ${topic.label}`);
    return { text: parts.join(" · "), kind: author ? "author" : "topic" };
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" });
  }

  function renderFeed() {
    const list = document.getElementById("feedList");
    const countEl = document.getElementById("feedCount");
    const totalFollowed = authors.length + topics.length;

    if (totalFollowed === 0) {
      list.innerHTML = "";
      countEl.textContent = "";
      list.insertAdjacentHTML("beforeend", `
        <div class="empty">
          <span class="serif">Nothing to follow yet</span>
          Follow an author or a topic in Discover, and their new papers will land here.
          <div><button class="btn" onclick="document.querySelector('[data-view=discover]').click()">Go to Discover</button></div>
        </div>`);
      return;
    }

    if (currentFeed.length === 0) {
      list.innerHTML = `<div class="empty"><span class="serif">No papers yet</span>Pull to refresh, or check back after your next tap on Refresh.</div>`;
      countEl.textContent = "";
      return;
    }

    countEl.textContent = `${currentFeed.length} papers`;
    list.innerHTML = currentFeed.map((p) => {
      const src = sourceLabel(p._sources);
      const isUnread = !seen[p.id];
      return `
        <article class="card by-${src.kind} ${isUnread ? "unread" : ""}">
          <div class="source-tag ${src.kind}">${src.text}</div>
          <h3 class="title serif">${escapeHtml(p.title)}</h3>
          <div class="authors">${p.authors.slice(0, 4).map(escapeHtml).join(", ")}${p.authors.length > 4 ? " et al." : ""}</div>
          <div class="abstract">${escapeHtml(p.summary)}</div>
          <div class="meta-row">
            <div class="tags">${p.categories.slice(0, 3).map((c) => `<span class="tag mono">${c}</span>`).join("")}</div>
            <div class="date-id mono">${formatDate(p.published)} · ${p.shortId}</div>
          </div>
          <div class="meta-row" style="margin-top:10px;">
            <div class="links">
              <a href="${p.absLink}" target="_blank" rel="noopener">Abstract</a>
              <a href="${p.pdfLink}" target="_blank" rel="noopener">PDF</a>
            </div>
          </div>
        </article>`;
    }).join("");
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function markAllSeen() {
    currentFeed.forEach((p) => { seen[p.id] = true; });
    save(LS.seen, seen);
  }

  function unreadCount() {
    return currentFeed.filter((p) => !seen[p.id]).length;
  }

  function updateBadge() {
    const n = unreadCount();
    const badge = document.getElementById("feedBadge");
    if (n > 0) { badge.style.display = "flex"; badge.textContent = n > 9 ? "9+" : n; }
    else badge.style.display = "none";
  }

  // ---------- discover: authors ----------
  async function searchAuthor() {
    const input = document.getElementById("authorInput");
    const name = input.value.trim();
    if (!name) return;
    const btn = document.getElementById("authorSearchBtn");
    const resultsEl = document.getElementById("authorResults");
    btn.disabled = true;
    resultsEl.innerHTML = `<div class="empty" style="padding:20px;"><span class="spinner"></span></div>`;
    try {
      const url = buildUrl(`au:"${name}"`, 3);
      const xml = await arxivRaw(url);
      const papers = parseFeed(xml);
      if (papers.length === 0) {
        resultsEl.innerHTML = `<div class="empty">No papers found for that name. Check the spelling, or try initials (e.g. "J. Maldacena").</div>`;
        return;
      }
      const alreadyFollowed = authors.some((a) => a.name.toLowerCase() === name.toLowerCase());
      resultsEl.innerHTML = `
        <div class="author-hit">
          <div class="name">${escapeHtml(name)}</div>
          <div class="sample">Recent: “${escapeHtml(papers[0].title)}” (${formatDate(papers[0].published)})</div>
          <button class="btn small" id="followAuthorBtn" ${alreadyFollowed ? "disabled" : ""}>
            ${alreadyFollowed ? "Already following" : "Follow"}
          </button>
        </div>`;
      const followBtn = document.getElementById("followAuthorBtn");
      if (followBtn && !alreadyFollowed) {
        followBtn.onclick = () => {
          authors.push({ id: "a_" + Date.now(), name });
          save(LS.authors, authors);
          toast(`Following ${name}`);
          renderFollowing();
          followBtn.disabled = true;
          followBtn.textContent = "Already following";
          refresh();
        };
      }
    } catch (e) {
      resultsEl.innerHTML = `<div class="empty">Couldn't reach arXiv right now. Try again in a moment.</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  // ---------- discover: topics ----------
  function isTopicFollowed(kindQuery) {
    return topics.some((t) => t.kind === kindQuery.kind && t.query.toLowerCase() === kindQuery.query.toLowerCase());
  }

  function toggleTopic(kind, query, label) {
    const idx = topics.findIndex((t) => t.kind === kind && t.query.toLowerCase() === query.toLowerCase());
    if (idx >= 0) {
      topics.splice(idx, 1);
      toast(`Unfollowed ${label}`);
    } else {
      topics.push({ id: "t_" + Date.now() + Math.random().toString(36).slice(2, 6), kind, query, label });
      toast(`Following ${label}`);
    }
    save(LS.topics, topics);
    renderDiscoverTopics();
    renderFollowing();
    refresh();
  }

  function renderDiscoverTopics() {
    const catEl = document.getElementById("categoryChips");
    catEl.innerHTML = CATEGORY_PRESETS.map((c) => {
      const on = isTopicFollowed({ kind: "category", query: c.code });
      return `<button class="chip ${on ? "on" : ""}" data-kind="category" data-query="${c.code}" data-label="${c.label}">
        ${c.label}<span class="catcode mono">${c.code}</span>
      </button>`;
    }).join("");

    const kwEl = document.getElementById("keywordChips");
    const customFollowed = topics.filter(
      (t) => t.kind === "keyword" && !KEYWORD_PRESETS.some((k) => k.toLowerCase() === t.query.toLowerCase())
    );
    const allKeywords = [...KEYWORD_PRESETS, ...customFollowed.map((t) => t.query)];
    kwEl.innerHTML = allKeywords.map((kw) => {
      const on = isTopicFollowed({ kind: "keyword", query: kw });
      return `<button class="chip ${on ? "on" : ""}" data-kind="keyword" data-query="${kw}" data-label="${kw}">${kw}</button>`;
    }).join("");

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.onclick = () => toggleTopic(chip.dataset.kind, chip.dataset.query, chip.dataset.label);
    });
  }

  // ---------- following tab ----------
  function renderFollowing() {
    const aEl = document.getElementById("followedAuthorsList");
    aEl.innerHTML = authors.length
      ? authors.map((a) => `
        <div class="follow-row">
          <div><span class="label">${escapeHtml(a.name)}</span><span class="kind">Author</span></div>
          <button data-id="${a.id}" class="unfollow-author">Unfollow</button>
        </div>`).join("")
      : `<div class="empty" style="padding:18px;">No authors followed yet.</div>`;

    const tEl = document.getElementById("followedTopicsList");
    tEl.innerHTML = topics.length
      ? topics.map((t) => `
        <div class="follow-row">
          <div><span class="label">${escapeHtml(t.label)}</span><span class="kind">${t.kind === "category" ? "Category" : "Keyword"}</span></div>
          <button data-id="${t.id}" class="unfollow-topic">Unfollow</button>
        </div>`).join("")
      : `<div class="empty" style="padding:18px;">No topics followed yet.</div>`;

    aEl.querySelectorAll(".unfollow-author").forEach((btn) => {
      btn.onclick = () => {
        authors = authors.filter((a) => a.id !== btn.dataset.id);
        save(LS.authors, authors);
        renderFollowing();
        refresh();
      };
    });
    tEl.querySelectorAll(".unfollow-topic").forEach((btn) => {
      btn.onclick = () => {
        topics = topics.filter((t) => t.id !== btn.dataset.id);
        save(LS.topics, topics);
        renderFollowing();
        renderDiscoverTopics();
        refresh();
      };
    });
  }

  // ---------- notifications ----------
  function updateNotifUI() {
    const btn = document.getElementById("notifBtn");
    const label = document.getElementById("notifLabel");
    if (!("Notification" in window)) {
      btn.style.display = "none";
      label.textContent = "Notifications aren't supported in this browser.";
      return;
    }
    if (Notification.permission === "granted") {
      btn.textContent = "Enabled";
      btn.disabled = true;
    } else if (Notification.permission === "denied") {
      btn.textContent = "Blocked";
      btn.disabled = true;
      label.textContent = "Notifications are blocked for this app in your browser settings.";
    } else {
      btn.textContent = "Enable";
      btn.disabled = false;
    }
  }

  function maybeNotify(newCount) {
    if (newCount === 0) return;
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    new Notification("Orbita", {
      body: `${newCount} new paper${newCount === 1 ? "" : "s"} from what you follow.`,
      icon: "icon-192.png",
    });
  }

  // ---------- refresh cycle ----------
  let refreshing = false;
  async function refresh({ silent } = {}) {
    if (refreshing) return;
    refreshing = true;
    const icon = document.getElementById("refreshIcon");
    icon.innerHTML = '<span class="spinner"></span>';
    const beforeIds = new Set(currentFeed.map((p) => p.id));
    try {
      await rebuildFeed();
      const newOnes = currentFeed.filter((p) => !beforeIds.has(p.id) && !seen[p.id]);
      renderFeed();
      updateBadge();
      if (!silent) toast("Feed updated");
      maybeNotify(newOnes.length);
    } catch (e) {
      if (!silent) toast("Couldn't refresh — check your connection");
    } finally {
      icon.textContent = "↻";
      refreshing = false;
    }
  }

  // ---------- nav ----------
  document.querySelectorAll("nav.bottom .tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav.bottom .tab").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("view-" + btn.dataset.view).classList.add("active");
      if (btn.dataset.view === "feed") {
        setTimeout(() => { markAllSeen(); updateBadge(); renderFeed(); }, 900);
      }
    });
  });

  document.getElementById("refreshBtn").addEventListener("click", () => refresh());
  document.getElementById("authorSearchBtn").addEventListener("click", searchAuthor);
  document.getElementById("authorInput").addEventListener("keydown", (e) => { if (e.key === "Enter") searchAuthor(); });
  document.getElementById("customTopicBtn").addEventListener("click", () => {
    const input = document.getElementById("customTopicInput");
    const val = input.value.trim();
    if (!val) return;
    toggleTopic("keyword", val, val);
    input.value = "";
  });
  document.getElementById("customTopicInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("customTopicBtn").click();
  });
  document.getElementById("notifBtn").addEventListener("click", async () => {
    const perm = await Notification.requestPermission();
    updateNotifUI();
    if (perm === "granted") toast("Notifications enabled");
  });

  // ---------- boot ----------
  function boot() {
    renderFeed();
    renderDiscoverTopics();
    renderFollowing();
    updateBadge();
    updateNotifUI();
    if (authors.length + topics.length > 0) refresh({ silent: true });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  }
  boot();
})();
</script>
</body>
</html>
